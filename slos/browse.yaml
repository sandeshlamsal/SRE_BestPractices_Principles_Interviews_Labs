# SLOs for the Browse catalog critical user journey.
# Covers product list + detail APIs AND recommendations ("You may also like" on every product page).
# P2 drill: recommendations were the biggest error source when a product failed, but no SLO covered them (P2-ISSUE-21).
version: "prometheus/v1"
service: "browse"
labels:
  owner: "sre-lab"
  cuj: "browse"
slos:
  - name: "availability"
    objective: 99.9
    description: "Product and recommendation API requests are not HTTP 5xx."
    sli:
      events:
        error_query: >-
          (sum(rate(traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER",
          span_name=~"GET /api/products.*|GET /api/recommendations",
          http_response_status_code=~"5.."}[{{.window}}])) or vector(0))
        total_query: >-
          sum(rate(traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER",
          span_name=~"GET /api/products.*|GET /api/recommendations",http_response_status_code!=""}[{{.window}}]))
    alerting:
      name: BrowseAvailabilityBudgetBurn
      labels:
        category: availability
      annotations:
        summary: "Browse availability error budget is burning too fast."
        runbook: "https://github.com/sandeshlamsal/SRE_BestPractices_Principles_Interviews_Labs/blob/main/runbooks/browse-availability.md"
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket

  - name: "latency"
    objective: 99
    description: "Product and recommendation API requests complete in under 400 ms (bucket le=400)."
    sli:
      events:
        error_query: >-
          (
            sum(rate(traces_span_metrics_duration_milliseconds_count{service_name="frontend",span_kind="SPAN_KIND_SERVER",
            span_name=~"GET /api/products.*|GET /api/recommendations",http_response_status_code!=""}[{{.window}}]))
            -
            sum(rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend",span_kind="SPAN_KIND_SERVER",
            span_name=~"GET /api/products.*|GET /api/recommendations",le="400",http_response_status_code!=""}[{{.window}}]))
          )
        total_query: >-
          sum(rate(traces_span_metrics_duration_milliseconds_count{service_name="frontend",span_kind="SPAN_KIND_SERVER",
          span_name=~"GET /api/products.*|GET /api/recommendations",http_response_status_code!=""}[{{.window}}]))
    alerting:
      name: BrowseLatencyBudgetBurn
      labels:
        category: latency
      annotations:
        summary: "Browse latency error budget is burning too fast."
        runbook: "https://github.com/sandeshlamsal/SRE_BestPractices_Principles_Interviews_Labs/blob/main/runbooks/browse-latency.md"
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket
