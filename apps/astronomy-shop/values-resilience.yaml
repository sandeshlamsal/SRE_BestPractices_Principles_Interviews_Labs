# Phase 5 hardening for the critical path (applied by `make deploy` after values.yaml).
# Every setting maps to a measured finding (docs/labs/phase-5-resilience-chaos.md):
#   replicas: 2 + pod anti-affinity (preferred, per node) -> survive losing one node   (P5-ISSUE-4: 1 node = ~45% failures, 8 min)
#   probes: NOT here; the chart schema only allows httpGet probes, so grpc/tcp probes are injected by the
#           post-renderer (scripts/helm-postrender.py + apps/astronomy-shop/postrender.yaml)   (P5-ISSUE-9)
#   tolerations unreachable/not-ready 30 s (default 300 s)  -> evict from a dead node in ~70 s, not ~6 min
# Anti-affinity is PREFERRED, not required: with 2 nodes, "required" would leave replicas Pending during a node loss.
components:
  checkout:
    replicas: 2
    schedulingRules:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: checkout
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
