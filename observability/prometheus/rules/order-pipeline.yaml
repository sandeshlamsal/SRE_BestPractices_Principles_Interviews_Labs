- name: sloth-slo-alerts-order-pipeline-completeness
  rules:
  - alert: OrderPipelineCompletenessBudgetBurn
    expr: |
      (
          max(slo:sli_error:ratio_rate5m{sloth_id="order-pipeline-completeness", sloth_service="order-pipeline", sloth_slo="completeness"} > (14.4 * 0.0009999999999999432)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate1h{sloth_id="order-pipeline-completeness", sloth_service="order-pipeline", sloth_slo="completeness"} > (14.4 * 0.0009999999999999432)) without (sloth_window)
      )
      or
      (
          max(slo:sli_error:ratio_rate30m{sloth_id="order-pipeline-completeness", sloth_service="order-pipeline", sloth_slo="completeness"} > (6 * 0.0009999999999999432)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate6h{sloth_id="order-pipeline-completeness", sloth_service="order-pipeline", sloth_slo="completeness"} > (6 * 0.0009999999999999432)) without (sloth_window)
      )
    labels:
      category: completeness
      severity: page
      sloth_severity: page
    annotations:
      runbook: https://github.com/sandeshlamsal/SRE_BestPractices_Principles_Interviews_Labs/blob/main/runbooks/order-pipeline-completeness.md
      summary: Published orders are not being processed by accounting (orders lost
        or stuck in the async pipeline).
      title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
        burn rate is too fast.
