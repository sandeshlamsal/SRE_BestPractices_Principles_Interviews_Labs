# Overrides for the opentelemetry-demo Helm chart (pinned in the Makefile: CHART_VERSION).
# Upstream defaults: helm show values open-telemetry/opentelemetry-demo --version <CHART_VERSION>
#
# Phase 2: telemetry goes to the platform stack in the `observability` namespace
# (kube-prometheus-stack + Tempo + Loki). The demo's bundled Prometheus/Grafana/Jaeger/OpenSearch
# are disabled. History of the Phase 0/1 settings: docs/labs/phase-*.md.

components:
  # AI assistant components (demo 3.x). They need an external LLM endpoint + API key
  # (defaults point at a placeholder URL with an empty key), so they'd crash-loop and add
  # noise unrelated to the shop's user journeys. Disabled for the lab; saves ~1.5 GB.
  # See docs/labs/phase-0-foundation.md -> Issues log, ISSUE-3.
  agent:
    enabled: false
  chatbot:
    enabled: false
  mcp:
    enabled: false

  frontend-proxy:
    # Keep the single entry point: http://localhost:8080/grafana now serves the platform Grafana
    # (served from sub-path /grafana, see observability/kube-prometheus-stack/values.yaml).
    envOverrides:
      - name: GRAFANA_HOST
        value: kps-grafana.observability.svc.cluster.local
      - name: GRAFANA_PORT
        value: "80"

# Bundled backends replaced by the platform stack (Phase 2).
prometheus:
  enabled: false
grafana:
  enabled: false
jaeger:
  enabled: false
opensearch:
  enabled: false

opentelemetry-collector:
  # Expose the collector's own metrics on :8888 so Prometheus can PULL them directly.
  # The demo only PUSHES self-telemetry back through the collector itself -- if the pipeline
  # stalls, the metrics describing the stall stall too (see P1-ISSUE-16, P2 guide).
  ports:
    metrics:
      enabled: true
  config:
    receivers:
      kubeletstats:
        # kind's kubelet serving certs have no IP SANs (P1-ISSUE-17). Lab-only; NOT for EKS.
        insecure_skip_verify: true
    connectors:
      span_metrics:
        # P1-ISSUE-11: add HTTP status as a metric dimension so SLIs can classify failures by
        # status code. OTel marks HTTP *server* spans ERROR only for 5xx, but the frontend returns
        # 422 for failed checkouts -> span-status SLIs missed real failures.
        dimensions:
          - name: http.response.status_code   # current semconv (frontend, most services)
          - name: http.status_code            # legacy semconv (Envoy frontend-proxy)
    exporters:
      # The chart's jaeger/opensearch/prometheus exporters stay *defined* (the collector chart
      # deep-merges config in its template, so `key: null` can't delete them) but they're unused:
      # the collector only starts exporters referenced by a pipeline. See P2 guide, P2-ISSUE-4.
      otlp_http/platform-prometheus:
        endpoint: http://kps-prometheus.observability:9090/api/v1/otlp
        tls:
          insecure: true
        sending_queue:
          batch: {}
      otlp_grpc/platform-tempo:
        endpoint: tempo.observability:4317
        tls:
          insecure: true
        sending_queue:
          batch: {}
      otlp_http/platform-loki:
        endpoint: http://loki.observability:3100/otlp
        tls:
          insecure: true
        sending_queue:
          batch: {}
    service:
      telemetry:
        metrics:
          level: detailed
          readers:                       # Helm replaces lists: keep the demo's push reader + add pull
            - periodic:
                interval: 10000
                timeout: 5000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://otel-collector:4318
                    insecure: true
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          exporters: [otlp_grpc/platform-tempo, debug, span_metrics]
        metrics:
          exporters: [otlp_http/platform-prometheus, debug]
        logs:
          exporters: [otlp_http/platform-loki, debug]
