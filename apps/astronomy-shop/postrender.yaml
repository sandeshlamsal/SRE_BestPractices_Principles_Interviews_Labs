# Post-render patches for the opentelemetry-demo chart, for things its values schema/templates can't express.
# Applied by scripts/helm-postrender.py via `helm upgrade --post-renderer` (make deploy).
#   probes : grpc (7 services VERIFIED to implement grpc.health.v1: SERVING) or tcpSocket (HTTP services).
#            The chart schema only allows httpGet probes (P5-ISSUE-9).
#   strategy: Recreate for single-writer stateful deployments (added in the stateful step).
deployments:
  checkout:
    containers:
      checkout:
        readinessProbe:
          grpc: &id001
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          grpc: *id001
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
  cart:
    containers:
      cart:
        readinessProbe:
          grpc: &id002
