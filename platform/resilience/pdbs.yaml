# PodDisruptionBudgets (Phase 5): voluntary disruptions (node drain, upgrades) must keep >= 1 replica serving.
# The demo chart has no PDB support, so they live here. Apply: make resilience
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-pdb
  namespace: astronomy-shop
  labels:
    app.kubernetes.io/part-of: sre-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: checkout
---
