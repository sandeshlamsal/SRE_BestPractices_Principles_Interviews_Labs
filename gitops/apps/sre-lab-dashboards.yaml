apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: sre-lab-dashboards, namespace: argocd }
spec:
  project: default
  source: { repoURL: https://github.com/sandeshlamsal/SRE_BestPractices_Principles_Interviews_Labs, targetRevision: main, path: observability/dashboards }
  destination: { server: https://kubernetes.default.svc, namespace: observability }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
