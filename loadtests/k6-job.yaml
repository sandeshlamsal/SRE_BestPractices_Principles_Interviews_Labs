# Runs loadtests/checkout-journey.js in-cluster.   make loadtest   (ConfigMap created from the script by the Makefile)
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-capacity
  namespace: astronomy-shop
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app.kubernetes.io/name: k6 }
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:1.4.0
          args: ["run", "--quiet", "/scripts/checkout-journey.js"]
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts: [{ name: scripts, mountPath: /scripts }]
      volumes:
        - name: scripts
          configMap: { name: k6-scripts }
