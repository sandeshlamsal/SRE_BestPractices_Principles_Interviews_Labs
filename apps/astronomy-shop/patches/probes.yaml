# Strategic-merge patches: gRPC/TCP probes (the chart schema only allows httpGet, P5-ISSUE-9).
# gRPC health VERIFIED (grpc-health-probe SERVING) for checkout, cart, product-catalog, currency, payment, recommendation, ad.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  template:
    spec:
      containers:
      - name: checkout
        readinessProbe:
          grpc: &id001
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          grpc: *id001
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
---
