# Grafana Loki, Monolithic mode on local filesystem (grafana-community/loki, pinned in Makefile: LOKI_VERSION).
# Production (EKS, Phase 8) switches storage to S3; the chart default (SimpleScalable, 3x replicas,
# memcached caches, object storage) is too heavy for a laptop.
deploymentMode: Monolithic
loki:
  auth_enabled: false                   # single tenant lab
  commonConfig:
    replication_factor: 1
  # P2-ISSUE-22 (happened twice): after a VM pause > 1 min (host sleep), the single Loki instance missed its
  # own ring heartbeat, auto-forgot itself, and rejected all logs (503) until restarted. Tolerate short pauses.
  # Production answer: >= 3 replicas, not a longer timeout.
  structuredConfig:
    ingester:
      lifecycler:
        ring:
          heartbeat_timeout: 10m
    distributor:
      ring:
        heartbeat_timeout: 10m
    compactor:
      compactor_ring:
        heartbeat_timeout: 10m
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true     # required for OTLP ingestion
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
# Components not used in Monolithic mode
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
